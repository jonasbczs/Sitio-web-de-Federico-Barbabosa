<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Features | Federico Barbabosa — Cinematographer</title>
    
    <style>
        /* --- DECLARACIÓN DE LA TIPOGRAFÍA PERSONALIZADA --- */
        @font-face {
            font-family: 'Alte Haas Grotesk Bold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- ESTILOS BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            color: #ffffff; /* Texto general en blanco */
            background-color: #000000; /* Fondo negro */
            font-size: 14px; 
            line-height: 1.4; 
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        a { text-decoration: none; color: inherit; }
        
        /* --- LIMITADOR DE ANCHO PARA PANTALLAS GRANDES --- */
        .page-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background-color: #000000; /* Fondo negro */
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
        }
        
        /* --- CABECERA FIJA ARRIBA (NON-STICKY) --- */
        .main-header { 
            position: relative; 
            width: 100%; 
            background-color: #ffffff; /* Fondo blanco */
            color: #000000; /* Texto negro */
            padding: 25px 40px; 
            z-index: 1000; 
        }
        .main-header .container { display: flex; justify-content: space-between; align-items: baseline; max-width: 1400px; margin: 0 auto; }
        
        /* --- APLICANDO LA TIPOGRAFÍA AL LOGO --- */
        .logo { 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            text-transform: none; 
            color: #000000;
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 20px; 
        }

        nav.main { display: flex; gap: 25px; }
        nav.main a { font-size: 16px; color: #000000; transition: color 0.3s ease; }
        nav.main a:hover { color: #888888; }
        
        /* Estilo para la página actual en la navegación */
        nav.main a.active {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #000000;
        }

        /* --- SECCIÓN DE FEATURES --- */
        .contentWrapper { flex: 1; padding-top: 40px; }
        .features-section { padding: 0 40px; margin-bottom: 100px; }
        
        /* Se eliminó la línea divisoria visible */
        .section-header.divider { 
            border: none; 
            margin-bottom: 20px; 
        }
        
        .features-list {
            display: flex;
            flex-direction: column;
            gap: 40px; /* Separación vertical reducida entre los videos */
            max-width: 1050px; /* Ancho amplio para los videos */
            margin: 0 auto; /* Centra el contenedor en la página */
        }
        
        .feature-entry {
            display: block;
            width: 100%;
        }
        
        .feature-entry a {
            display: block;
            cursor: pointer;
        }
        
        .feature-entry .placeholder {
            width: 100%;
            aspect-ratio: 16 / 9; /* Proporción panorámica para video */
            background-color: #111111;
            margin-bottom: 18px;
            overflow: hidden;
            position: relative;
            border: 1px solid #222222; /* Marco muy sutil, gris casi negro */
        }
        
        .feature-entry .placeholder img,
        .feature-entry .placeholder iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            transition: opacity 0.3s ease;
        }
        
        .feature-entry a:hover .placeholder img {
            opacity: 0.8;
        }
        
        .feature-title {
            text-align: left;
            font-size: 16px; /* Tamaño de letra en computadora */
            font-weight: bold;
            color: #ffffff; /* Letras blancas para los títulos */
        }
        
        /* --- FOOTER SOBRE FONDO NEGRO --- */
        footer.bottom-footer {
            width: 100%;
            border-top: 1px solid #1a1a1a;
            padding: 20px 40px;
            text-align: center;
            background-color: #000000;
        }
        
        .footer-credit {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 11px;
            color: #777777;
        }

        .footer-credit strong {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #aaaaaa;
        }
        
        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            .main-header { padding: 20px; }
            .main-header .container { flex-direction: column; gap: 15px; align-items: flex-start; }
            nav.main { flex-wrap: wrap; gap: 15px; }
            .features-section { padding: 0 20px; margin-bottom: 60px; }
            
            /* Ajustes específicos de espacio y tipografía para celular */
            .features-list { 
                gap: 20px; /* Distancia pequeña entre videos en celular */
                max-width: 100%; 
            }
            .feature-title {
                font-size: 13px; /* Letra del título más pequeña en celular */
            }
            
            footer.bottom-footer { padding: 15px 20px; }
        }
    </style>
</head>
<body class="s-home detail-page">
    <div class="page-container">
        <!-- CABECERA FIJA ARRIBA (FONDO BLANCO, LETRAS NEGRAS) -->
        <header class="main-header">
            <div class="container">
                <a class="logo" href="index.html">
                    <span class="brand-name">Federico Barbabosa</span> 
                    <span class="brand-title">— Cinematographer</span>
                </a>
                <nav class="main">
                    <a href="index.html">Home</a>
                    <a href="cine.html" class="active">Features</a>
                    <a href="comerciales.html">Commercials</a>
                    <a href="contacto.html">Contact</a>
                </nav>
            </div>
        </header>
        
        <!-- CONTENIDO PRINCIPAL -->
        <div id="contentWrapper" class="contentWrapper">
            <section class="features-section">
                <!-- Se eliminó el <h1>Features</h1> y quedó solo la línea (ahora invisible) -->
                <header class="section-header divider"></header>
                
                <div class="features-list">
                    <!-- Feature 1 (Violentas mariposas con video de Vimeo incrustado) -->
                    <div class="feature-entry">
                        <!-- Se quitó la etiqueta 'a' para que el video se pueda reproducir sin redirigir -->
                        <div class="placeholder">
                            <iframe src="https://player.vimeo.com/video/1229735465?title=0&byline=0&portrait=0" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
                        </div>
                        <div class="feature-title">Violentas mariposas</div>
                    </div>
                    
                    <!-- Placeholder 2 -->
                    <div class="feature-entry">
                        <a href="#">
                            <div class="placeholder">
                                <img src="https://picsum.photos/seed/feat2/1280/720?grayscale" alt="Peli 2" />
                            </div>
                            <div class="feature-title">Peli 2</div>
                        </a>
                    </div>
                    
                    <!-- Placeholder 3 -->
                    <div class="feature-entry">
                        <a href="#">
                            <div class="placeholder">
                                <img src="https://picsum.photos/seed/feat3/1280/720?grayscale" alt="Peli 3" />
                            </div>
                            <div class="feature-title">Peli 3</div>
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </div> <!-- Cierre de page-container -->
    
    <!-- FOOTER FUERA DE PAGE-CONTAINER -->
    <footer class="bottom-footer" id="contacto">
        <p class="footer-credit">
            <strong>Website Design:</strong> Colectivo Monclova
        </p>
    </footer>

    <!-- LIBRERÍA OFICIAL DE VIMEO -->
    <script src="https://player.vimeo.com/api/player.js"></script>
    
    <!-- SCRIPT PARA EVITAR LA PANTALLA DE SUGERENCIAS AL FINAL -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const iframes = document.querySelectorAll('.feature-entry iframe');
            
            iframes.forEach(function(iframe) {
                const player = new Vimeo.Player(iframe);
                let hasReset = false;
                
                player.on('timeupdate', function(data) {
                    if (data.duration > 0 && (data.duration - data.seconds) <= 0.4 && !hasReset) {
                        hasReset = true; 
                        
                        player.pause().then(function() {
                            player.setCurrentTime(0).then(function() {
                                hasReset = false; 
                            });
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
