<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Federico Barbabosa — Cinematographer</title>
    
    <style>
        /* --- DECLARACIÓN DE LA TIPOGRAFÍA PERSONALIZADA --- */
        @font-face {
            font-family: 'Alte Haas Grotesk Bold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- ESTILOS BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #000000; background-color: #ffffff; font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        
        /* --- LIMITADOR DE ANCHO PARA PANTALLAS GRANDES --- */
        .page-container { max-width: 1400px; margin: 0 auto; background-color: #ffffff; }
        
        /* --- CABECERA FIJA --- */
        .main-header { position: sticky; top: 0; left: 0; width: 100%; background-color: rgba(255, 255, 255, 0.95); padding: 25px 40px; z-index: 1000; }
        .main-header .container { display: flex; justify-content: space-between; align-items: baseline; max-width: 1400px; margin: 0 auto; }
        
        /* --- APLICANDO LA TIPOGRAFÍA AL LOGO --- */
        .logo { 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            text-transform: none; 
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 20px; 
        }

        nav.main { display: flex; gap: 25px; }
        nav.main a { font-size: 16px; transition: color 0.3s ease; }
        nav.main a:hover { color: #888888; }
        
        /* Estilo para la página actual en la navegación */
        nav.main a.active {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
        }

        /* --- BANNER PRINCIPAL (Hero / Video Background Autoplay) --- */
        .full-width-banner { position: relative; width: 100%; height: 75vh; background-color: #000000; margin-bottom: 25px; overflow: hidden; }
        .video-background { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; transform: translateX(-50%) translateY(-50%); object-fit: cover; z-index: 1; }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); z-index: 2; }
        
        /* --- TEXTO SOBRE EL VIDEO (Esquina inferior izquierda) --- */
        .banner-caption {
            position: absolute;
            bottom: 30px;
            left: 40px;
            color: #ffffff;
            font-size: 16px;
            z-index: 3;
        }

        /* --- SECCIÓN DE MOSAICO (Proyectos en loop) --- */
        .grid-container { padding: 0 40px; margin-bottom: 100px; }
        .section-header.divider { border-top: 1px solid #000; padding-top: 10px; margin-bottom: 30px; }
        .section-header h1 { font-size: 18px; font-weight: normal; }
        
        /* Contenedor central para hacer los videos más pequeños */
        .mosaic-container {
            max-width: 900px; 
            margin: 0 auto;
        }

        /* Cuadrícula a 2 columnas */
        .entries-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; /* Separación pequeña entre recuadros */
        }
        
        .entry { display: block; cursor: pointer; }
        .entry .video-wrapper { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background-color: #f2f2f2; 
            overflow: hidden; 
            position: relative;
        }
        
        .entry .video-wrapper video, 
        .entry .video-wrapper img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: opacity 0.3s ease; 
        }
        
        .entry:hover .video-wrapper video,
        .entry:hover .video-wrapper img { 
            opacity: 0.8; 
        }
        
        /* --- FOOTER SIMPLIFICADO --- */
        footer.divider { 
            border-top: 1px solid #000; 
            margin: 0 40px; 
            padding: 30px 0; 
            font-size: 13px; 
            color: #666;
        }
        
        .footer-credit {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
        }

        .footer-credit strong {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #000;
        }
        
        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            .main-header { padding: 20px; }
            .main-header .container { flex-direction: column; gap: 15px; align-items: flex-start; }
            nav.main { flex-wrap: wrap; gap: 15px; }
            .full-width-banner { height: 50vh; margin-bottom: 20px; }
            .banner-caption { left: 20px; bottom: 20px; }
            .grid-container { padding: 0 20px; margin-bottom: 60px; }
            .entries-grid { grid-template-columns: 1fr; gap: 15px; } /* 1 columna o 2 columnas pequeñas en celular, lo dejamos en 1 para que se vea bien */
            footer.divider { margin: 0 20px; }
        }
    </style>
</head>
