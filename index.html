<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Federico Barbabosa — Cinematographer</title>
    
    <style>
        /* --- DECLARACIÓN DE LA TIPOGRAFÍA PERSONALIZADA --- */
        @font-face {
            font-family: 'Alte Haas Grotesk Bold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- ESTILOS BASE Y TRANSICIÓN DE PÁGINA --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            color: #000000; 
            background-color: #ffffff; 
            font-size: 14px; 
            line-height: 1.4; 
            -webkit-font-smoothing: antialiased; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            
            /* Configuración inicial para el efecto de Fade-in / Fade-out */
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        /* Clase que se activa al cargar la página para hacer el fade-in */
        body.loaded {
            opacity: 1;
        }

        /* Clase que se activa al hacer clic en un enlace para hacer el fade-out */
        body.fade-out {
            opacity: 0;
        }

        a { text-decoration: none; color: inherit; }
        
        /* --- CONTENEDOR CENTRAL --- */
        .page-container { 
            flex: 1; /* Empuja el footer hacia abajo */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra el contenido verticalmente */
            align-items: center; /* Centra el contenido horizontalmente */
            width: 100%;
            /* Desplaza todo ligeramente hacia arriba desde el centro puro */
            padding-bottom: 5vh; 
        }

        /* --- LOGOTIPO (AHORA GRANDE Y CENTRAL) --- */
        .logo { 
            text-align: center; /* Centra todo el contenido de texto en el interior */
            letter-spacing: -0.5px; 
            text-transform: none;
            margin-bottom: 25px; /* Espacio entre el título y el menú */
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
            font-size: 48px; /* Tamaño mucho más grande */
            display: block; /* Obliga a que ocupe su propia línea */
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 32px; 
            color: #333; /* Un gris oscuro para darle jerarquía visual */
            display: block; /* Obliga a que caiga a la siguiente línea */
            margin-top: 5px; /* Da un pequeñísimo respiro entre el nombre y el subtítulo */
        }

        /* --- NAVEGACIÓN (LETRAS MÁS CHICAS DEBAJO DEL NOMBRE) --- */
        nav.main { 
            display: flex; 
            gap: 30px; 
            justify-content: center;
        }
        
        nav.main a { 
            font-size: 14px; /* Letras más chicas */
            color: #555;
            transition: color 0.3s ease; 
        }
        
        nav.main a:hover { color: #000; }
        
        /* Estilo para la página actual en la navegación */
        nav.main a.active {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #000;
        }

        /* --- FOOTER SUTIL Y MUY DISCRETO --- */
        footer.bottom-footer {
            width: 100%;
            border-top: 1px solid #f2f2f2; /* Línea extremadamente tenue y discreta */
            padding: 14px 20px;
            text-align: center;
            margin-top: auto;
        }
        
        .footer-credit {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 10px; /* Texto más pequeño y liviano */
            color: #bbbbbb; /* Color gris muy claro para que no llame la atención */
        }

        .footer-credit strong {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #999999;
        }

        /* Estilos para el enlace de Instagram en el footer */
        .footer-credit a {
            transition: color 0.3s ease;
        }

        .footer-credit a:hover {
            color: #333333; /* Se oscurece ligeramente solo al pasar el cursor */
        }
        
        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            .logo .brand-name { font-size: 32px; }
            .logo .brand-title { font-size: 20px; }
            nav.main { gap: 15px; flex-wrap: wrap; justify-content: center; }
            footer.bottom-footer { padding: 12px 15px; }
        }
    </style>
</head>
<body class="s-home detail-page">
    
    <!-- CONTENIDO CENTRAL (LOGO + MENÚ) -->
    <div class="page-container">
        <!-- LOGO GRANDE -->
        <a class="logo" href="index.html">
            <span class="brand-name">Federico Barbabosa</span> 
            <span class="brand-title">Cinematographer</span>
        </a>
        
        <!-- MENÚ CHICO DEBAJO -->
        <nav class="main">
            <a href="index.html" class="active">Home</a>
            <a href="cine.html">Features</a>
            <a href="comerciales.html">Commercials</a>
            <a href="contacto.html">Contact</a>
        </nav>
    </div>
    
    <!-- FOOTER HASTA ABAJO Y DISCRETO -->
    <footer class="bottom-footer">
        <p class="footer-credit">
            <strong>Website Design:</strong> <a href="https://www.instagram.com/tallermonclova/" target="_blank" rel="noopener noreferrer">Taller Monclova</a>
        </p>
    </footer>

    <!-- SCRIPT PARA LAS TRANSICIONES FADE-IN Y FADE-OUT -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Efecto Fade-in al cargar la página
            document.body.classList.add('loaded');

            // Interceptar clics en todos los enlaces del menú (Home, Features, Commercials, Contact) y el logotipo
            const links = document.querySelectorAll('nav.main a, a.logo');
            
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    const targetUrl = this.getAttribute('href');
                    
                    // Asegurarse de que es un enlace interno válido
                    if (targetUrl && targetUrl !== '#' && !targetUrl.startsWith('mailto:') && !targetUrl.startsWith('http')) {
                        e.preventDefault(); // Evitar el salto inmediato
                        document.body.classList.add('fade-out'); // Activar desvanecimiento
                        
                        // Esperar a que termine la animación (400ms) antes de cambiar de página
                        setTimeout(function() {
                            window.location.href = targetUrl;
                        }, 400);
                    }
                });
            });
        });
    </script>
</body>
</html>
