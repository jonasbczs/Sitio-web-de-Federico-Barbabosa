<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Commercials | Federico Barbabosa — Cinematographer</title>
    
    <style>
        /* --- DECLARACIÓN DE LA TIPOGRAFÍA PERSONALIZADA --- */
        @font-face {
            font-family: 'Alte Haas Grotesk Bold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- ESTILOS BASE Y TRANSICIÓN FADE-IN / FADE-OUT --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            color: #ffffff; /* Texto general en blanco */
            background-color: #000000; /* Fondo negro */
            font-size: 14px; 
            line-height: 1.4; 
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            
            /* Estado inicial transparente para el efecto fade-in / fade-out */
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        /* Clase que activa la visibilidad al cargar la página */
        body.loaded {
            opacity: 1;
        }

        /* Clase que desvanece la página al hacer clic en un enlace */
        body.fade-out {
            opacity: 0;
        }

        a { text-decoration: none; color: inherit; }
        
        /* --- LIMITADOR DE ANCHO PARA PANTALLAS GRANDES --- */
        .page-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background-color: #000000; /* Fondo negro */
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
        }
        
        /* --- CABECERA FIJA ARRIBA (NON-STICKY) --- */
        .main-header { 
            position: relative; 
            width: 100%; 
            background-color: #ffffff; /* Fondo blanco */
            color: #000000; /* Texto negro sobre fondo blanco */
            padding: 25px 40px; 
            z-index: 1000; 
        }
        .main-header .container { display: flex; justify-content: space-between; align-items: baseline; max-width: 1400px; margin: 0 auto; }
        
        /* --- TIPOGRAFÍA Y TEXTO DEL LOGO EN EL HEADER --- */
        .logo { 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            text-transform: none; 
            color: #000000;
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 20px; 
        }

        nav.main { display: flex; gap: 25px; }
