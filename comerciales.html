        @font-face {

        /* --- ESTILOS BASE --- */

        .main-header .container { display: flex; justify-content: space-between; align-items: baseline; max-width: 1400px; margin: 0 auto; }
        
        /* --- APLICANDO LA TIPOGRAFÍA AL LOGO --- */
        .logo { 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            text-transform: none; 
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 20px; 
        }

        nav.main { display: flex; gap: 25px; }
        nav.main a { font-size: 16px; transition: color 0.3s ease; }
        nav.main a:hover { color: #888888; }
        
        /* Estilo para la página actual en la navegación */
        nav.main a.active {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
        }

        /* --- SECCIÓN DE COMERCIALES --- */
        .contentWrapper { flex: 1; padding-top: 5px; }
        .commercials-section { padding: 0 40px; margin-bottom: 100px; }
        
        /* Línea divisoria pegada arriba y sin título */
        .section-header.divider { 
            border-top: 1px solid #000; 
            margin-bottom: 50px; 
        }
        
        .commercials-list {
            display: flex;
            flex-direction: column;
            gap: 80px; /* Separación vertical entre los videos */
            max-width: 700px; /* Ancho máximo para centrar los placeholders */
            margin: 0 auto; /* Centra el contenedor en la página */
        }
        
        .commercial-entry {
            display: block;
            width: 100%;
        }
        
        .commercial-entry a {
            display: block;
            cursor: pointer;
        }

        .commercial-entry .placeholder {
            width: 100%;
            aspect-ratio: 16 / 9; /* Proporción panorámica para video */
            background-color: #f2f2f2;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .commercial-entry .placeholder img,
        .commercial-entry .placeholder iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            transition: opacity 0.3s ease;
        }
        
        .commercial-entry a:hover .placeholder img {
            opacity: 0.8;
        }
        
        .commercial-title {
            text-align: left;
            font-size: 15px;
            font-weight: bold;
        }
        
        /* --- FOOTER HASTA ABAJO Y DISCRETO (Igual que en index.html) --- */
        footer.bottom-footer {
            width: 100%;
            border-top: 1px solid #e0e0e0;
            padding: 20px 40px;
            text-align: center;
        }
        
        .footer-credit {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 11px; /* Texto muy discreto */
            color: #999;
        }

        .footer-credit strong {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #777;
        }
        
        /* --- RESPONSIVO --- */

            .main-header { padding: 20px; }
            .main-header .container { flex-direction: column; gap: 15px; align-items: flex-start; }
            nav.main { flex-wrap: wrap; gap: 15px; }
            .commercials-section { padding: 0 20px; margin-bottom: 60px; }
            .commercials-list { gap: 50px; }
            footer.bottom-footer { padding: 15px 20px; }
        }
    </style>

    <script src="https://player.vimeo.com/api/player.js"></script>
    
    <!-- SCRIPT PARA EVITAR LA PANTALLA DE SUGERENCIAS AL FINAL -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Seleccionamos todos los iframes de la página
            const iframes = document.querySelectorAll('.commercial-entry iframe');
            
            iframes.forEach(function(iframe) {
                const player = new Vimeo.Player(iframe);
                let hasReset = false; // Bandera de seguridad
                
                // Monitorizamos el tiempo de reproducción
                player.on('timeupdate', function(data) {
                    // Si faltan menos de 0.4 segundos para terminar, pausamos y reiniciamos
                    if (data.duration > 0 && (data.duration - data.seconds) <= 0.4 && !hasReset) {
                        hasReset = true; 
                        
                        player.pause().then(function() {
                            player.setCurrentTime(0).then(function() {
                                hasReset = false; 
                            });
                        });
                    }
                });
            });
        });
    </script>
