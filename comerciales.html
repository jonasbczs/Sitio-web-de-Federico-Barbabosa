<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Commercials | Federico Barbabosa — Cinematographer</title>
    
    <style>
        /* --- DECLARACIÓN DE LA TIPOGRAFÍA PERSONALIZADA --- */
        @font-face {
            font-family: 'Alte Haas Grotesk Bold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- ESTILOS BASE Y TRANSICIÓN DE PÁGINA --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            color: #ffffff; /* Texto general en blanco */
            background-color: #000000; /* Fondo negro */
            font-size: 14px; 
            line-height: 1.4; 
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            
            /* Configuración inicial para el efecto de Fade-in / Fade-out */
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        body.fade-out {
            opacity: 0;
        }

        a { text-decoration: none; color: inherit; }
        
        /* --- LIMITADOR DE ANCHO PARA PANTALLAS GRANDES --- */
        .page-container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background-color: #000000; /* Fondo negro */
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
        }
        
        /* --- CABECERA FIJA ARRIBA --- */
        .main-header { 
            position: relative; 
            width: 100%; 
            background-color: #ffffff; /* Fondo blanco */
            color: #000000; /* Texto negro */
            padding: 25px 40px; 
            z-index: 1000; 
        }
        .main-header .container { display: flex; justify-content: space-between; align-items: baseline; max-width: 1400px; margin: 0 auto; }
        
        /* --- APLICANDO LA TIPOGRAFÍA AL LOGO --- */
        .logo { 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            text-transform: none; 
            color: #000000;
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 20px; 
        }

        nav.main { display: flex; gap: 25px; }
        nav.main a { font-size: 16px; color: #000000; transition: color 0.3s ease; }
        nav.main a:hover { color: #888888; }
        
        /* Estilo para la página actual en la navegación */
        nav.main a.active {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #000000;
        }

        /* --- SECCIÓN DE COMERCIALES (Columna Centrada) --- */
        .contentWrapper { flex: 1; padding-top: 40px; }
        .commercials-section { padding: 0 40px; margin-bottom: 100px; }
        
        .section-header.divider { 
            border: none; 
            margin-bottom: 20px; 
        }
        
        .commercials-list {
            display: flex;
            flex-direction: column;
            gap: 60px; /* Separación vertical entre los videos */
            max-width: 1050px; /* Ancho amplio para los videos alineado al estilo de cine.html */
            margin: 0 auto; /* Centra el contenedor en la página */
        }
        
        .commercial-entry {
            display: block;
            width: 100%;
        }
        
        .commercial-entry .placeholder {
            width: 100%;
            aspect-ratio: 16 / 9; /* Proporción panorámica para video */
            background-color: #111111;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            border: 1px solid #222222; /* Marco sutil y elegante */
        }
        
        .commercial-entry .placeholder iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }
        
        .commercial-title {
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff; /* Letras blancas para los títulos */
        }
        
        /* --- FOOTER SOBRE FONDO NEGRO --- */
        footer.bottom-footer {
            width: 100%;
            border-top: 1px solid #1a1a1a;
            padding: 20px 40px;
            text-align: center;
            background-color: #000000;
        }
        
        .footer-credit {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 11px;
            color: #777777;
        }

        .footer-credit strong {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #aaaaaa;
        }
        
        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            .main-header { padding: 20px; }
            .main-header .container { flex-direction: column; gap: 15px; align-items: flex-start; }
            nav.main { flex-wrap: wrap; gap: 15px; }
            .commercials-section { padding: 0 20px; margin-bottom: 60px; }
            
            .commercials-list { 
                gap: 40px; 
                max-width: 100%; 
            }
            .commercial-title {
                font-size: 13px;
            }
            
            footer.bottom-footer { padding: 15px 20px; }
        }
    </style>
</head>
<body class="s-home detail-page">

    <!-- LIBRERÍA OFICIAL DE VIMEO -->
    <script src="https://player.vimeo.com/api/player.js"></script>
    
    <!-- SCRIPT PARA LAS TRANSICIONES FADE-IN Y FADE-OUT -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Activa el fade-in al cargar la página
            document.body.classList.add('loaded');

            // Intercepta los clics en el menú y el logo para el fade-out
            const links = document.querySelectorAll('nav.main a, a.logo');
            
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    const targetUrl = this.getAttribute('href');
                    
                    if (targetUrl && targetUrl !== '#' && !targetUrl.startsWith('mailto:')) {
                        e.preventDefault(); 
                        document.body.classList.add('fade-out'); 
                        
                        setTimeout(function() {
                            window.location.href = targetUrl;
                        }, 400);
                    }
                });
            });
            
            // SCRIPT PARA REINICIAR CADA VIDEO AL FINAL
            const iframes = document.querySelectorAll('.commercial-entry iframe');
            
            iframes.forEach(function(iframe) {
                const player = new Vimeo.Player(iframe);
                let hasReset = false;
                
                player.on('timeupdate', function(data) {
                    if (data.duration > 0 && (data.duration - data.seconds) <= 0.4 && !hasReset) {
                        hasReset = true; 
                        
                        player.pause().then(function() {
                            player.setCurrentTime(0).then(function() {
                                hasReset = false; 
                            });
                        });
                    }
                });
            });
        });
    </script>
