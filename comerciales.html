<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Commercials | Federico Barbabosa — Cinematographer</title>
    
    <style>
        /* --- DECLARACIÓN DE LA TIPOGRAFÍA PERSONALIZADA --- */
        @font-face {
            font-family: 'Alte Haas Grotesk Bold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- ESTILOS BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #000000; background-color: #ffffff; font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        
        /* --- LIMITADOR DE ANCHO PARA PANTALLAS GRANDES --- */
        .page-container { max-width: 1400px; margin: 0 auto; background-color: #ffffff; flex: 1; display: flex; flex-direction: column; width: 100%; }
        
        /* --- CABECERA FIJA --- */
        .main-header { position: sticky; top: 0; left: 0; width: 100%; background-color: rgba(255, 255, 255, 0.95); padding: 25px 40px; z-index: 1000; }
        .main-header .container { display: flex; justify-content: space-between; align-items: baseline; max-width: 1400px; margin: 0 auto; }
        
        /* --- APLICANDO LA TIPOGRAFÍA AL LOGO --- */
        .logo { 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            text-transform: none; 
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 20px; 
        }

        nav.main { display: flex; gap: 25px; }
        nav.main a { font-size: 16px; transition: color 0.3s ease; }
        nav.main a:hover { color: #888888; }
        
        /* Estilo para la página actual en la navegación */
        nav.main a.active {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
        }

        /* --- SECCIÓN DE GRID (Proyectos) --- */
        .contentWrapper { flex: 1; padding-top: 40px; }
        .grid-container { padding: 0 40px; margin-bottom: 100px; }
        .section-header.divider { border-top: 1px solid #000; padding-top: 10px; margin-bottom: 30px; }
        .section-header h1 { font-size: 18px; font-weight: normal; }
        
        .entries-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 80px 40px; }
        .entry { display: block; cursor: pointer; }
        .entry .placeholder { width: 100%; aspect-ratio: 4 / 3; background-color: #f2f2f2; margin-bottom: 15px; overflow: hidden; }
        .entry .placeholder img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s ease; }
        .entry:hover .placeholder img { opacity: 0.8; }
        
        .titles .title { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .titles .subtitle, .titles .date { font-size: 14px; color: #666; display: block; }
        
        /* --- FOOTER SIMPLIFICADO --- */
        footer.divider { 
            border-top: 1px solid #000; 
            margin: 0 40px; 
            padding: 30px 0; 
            font-size: 13px; 
            color: #666;
        }
        
        .footer-credit {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
        }

        .footer-credit strong {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #000;
        }
        
        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            .main-header { padding: 20px; }
            .main-header .container { flex-direction: column; gap: 15px; align-items: flex-start; }
            nav.main { flex-wrap: wrap; gap: 15px; }
            .grid-container { padding: 0 20px; margin-bottom: 60px; }
            .entries-grid { grid-template-columns: 1fr; gap: 50px; }
            footer.divider { margin: 0 20px; }
        }
    </style>
</head>
