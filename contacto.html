<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Contacto | Federico Barbabosa — Cinematographer</title>
    
    <style>
        /* --- DECLARACIÓN DE LA TIPOGRAFÍA PERSONALIZADA --- */
        @font-face {
            font-family: 'Alte Haas Grotesk Bold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- ESTILOS BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #000000; background-color: #ffffff; font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        
        /* --- LIMITADOR DE ANCHO PARA PANTALLAS GRANDES --- */
        .page-container { max-width: 1400px; margin: 0 auto; background-color: #ffffff; flex: 1; display: flex; flex-direction: column; width: 100%; }
        
        /* --- CABECERA FIJA --- */
        .main-header { position: sticky; top: 0; left: 0; width: 100%; background-color: rgba(255, 255, 255, 0.95); padding: 25px 40px; z-index: 1000; }
        .main-header .container { display: flex; justify-content: space-between; align-items: baseline; max-width: 1400px; margin: 0 auto; }
        
        /* --- APLICANDO LA TIPOGRAFÍA AL LOGO --- */
        .logo { 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            text-transform: none; 
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 20px;
        }

        nav.main { display: flex; gap: 25px; }
        nav.main a { font-size: 16px; transition: color 0.3s ease; }
        nav.main a:hover { color: #888888; }
        
        /* Estilo para la página actual en la navegación */
        nav.main a.active {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
        }

        /* --- SECCIÓN DE CONTACTO (Centrada) --- */
        .contentWrapper {
            flex: 1; /* Permite que el contenedor ocupe el espacio disponible para empujar el footer hacia abajo */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .contact-container {
            text-align: center;
        }

        .contact-title {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-size: 48px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        .contact-email {
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .contact-email:hover {
            color: #888888;
        }

        /* --- FOOTER SIMPLIFICADO --- */
        footer.divider { 
            border-top: 1px solid #000; 
            margin: 90px 40px 60px 40px; /* Incrementado para bajar más la línea y el contenido inferior */
            padding-top: 20px; 
            font-size: 13px; 
            color: #666;
        }
        
        .footer-credit {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
        }

        .footer-credit strong {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #000;
        }
        
        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            .main-header { padding: 20px; }
            .main-header .container { flex-direction: column; gap: 15px; align-items: flex-start; }
            nav.main { flex-wrap: wrap; gap: 15px; }
            .contact-title { font-size: 36px; }
            .contact-email { font-size: 18px; }
            footer.divider { margin: 60px 20px 35px 20px; }
        }
    </style>
</head>
<body class="s-home detail-page">
    <div class="page-container">
        <!-- CABECERA -->
        <header class="main-header">
            <div class="container">
                <a class="logo" href="index.html">
                    <span class="brand-name">Federico Barbabosa</span> 
                    <span class="brand-title">— Cinematographer</span>
                </a>
                <nav class="main">
                    <a href="index.html">Home</a>
                    <a href="cine.html">Features</a>
                    <a href="comerciales.html">Commercials</a>
                    <a href="contacto.html" class="active">Contact</a>
                </nav>
            </div>
        </header>
        
        <!-- CONTENIDO CENTRAL DE CONTACTO -->
        <div id="contentWrapper" class="contentWrapper">
            <section class="contact-container">
                <h1 class="contact-title">Contact</h1>
                <a href="mailto:federicobarbabosa@yahoo.com.mx" class="contact-email">federicobarbabosa@yahoo.com.mx</a>
            </section>
        </div>
        
        <!-- FOOTER SIMPLIFICADO -->
        <footer class="divider" id="contacto">
            <div class="container">
                <p class="footer-credit">
                    <strong>Website Design:</strong> Colectivo Monclova
                </p>
            </div>
        </footer>
    </div>
</body>
</html>
