<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Contacto | Federico Barbabosa — Cinematographer</title>
    
    <style>
        /* --- DECLARACIÓN DE LA TIPOGRAFÍA PERSONALIZADA --- */
        @font-face {
            font-family: 'Alte Haas Grotesk Bold';
            src: url('AlteHaasGroteskBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- ESTILOS BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* La página ocupa el 100% de la altura (100vh) para que el footer se quede abajo */
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            color: #000000; 
            background-color: #ffffff; 
            font-size: 14px; 
            line-height: 1.4; 
            -webkit-font-smoothing: antialiased; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }
        
        /* --- CONTENEDOR CENTRAL --- */
        .page-container { 
            flex: 1; /* Empuja el footer hacia abajo */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra el contenido verticalmente */
            align-items: center; /* Centra el contenido horizontalmente */
            width: 100%;
        }
        
        /* --- CABECERA FIJA --- */
        .main-header { position: absolute; top: 0; left: 0; width: 100%; padding: 25px 40px; z-index: 1000; }
        .main-header .container { display: flex; justify-content: space-between; align-items: baseline; max-width: 1400px; margin: 0 auto; }
        
        /* --- APLICANDO LA TIPOGRAFÍA AL LOGO --- */
        .logo { 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            text-transform: none; 
        }
        
        .logo .brand-name {
            font-family: 'Alte Haas Grotesk Bold', sans-serif; 
            font-weight: normal; 
        }

        .logo .brand-title {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 20px;
        }

        nav.main { display: flex; gap: 25px; }
        nav.main a { font-size: 16px; transition: color 0.3s ease; }
        nav.main a:hover { color: #888888; }
        
        /* Estilo para la página actual en la navegación */
        nav.main a.active {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
        }

        /* --- SECCIÓN DE CONTACTO (Centrada) --- */
        .contentWrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            width: 100%;
        }

        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Alinea todo a la izquierda */
        }

        .contact-title {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-size: 48px;
            font-weight: normal;
            margin-bottom: 15px;
            text-align: left;
        }

        .contact-email {
            font-size: 20px;
            transition: color 0.3s ease;
            margin-bottom: 30px; /* Separación con los íconos sociales */
        }

        .contact-email:hover {
            color: #888888;
        }

        /* --- REDES SOCIALES --- */
        .social-links {
            display: flex;
            gap: 20px; /* Separación entre Instagram e IMDb */
        }

        .social-icon {
            font-size: 16px;
            font-weight: bold;
            color: #888888; /* Gris por defecto */
            transition: color 0.3s ease;
        }

        .social-icon:hover {
            color: #000000; /* Se oscurecen al pasar el mouse */
        }

        /* --- FOOTER SIMPLIFICADO Y DISCRETO HASTA ABAJO --- */
        footer.bottom-footer {
            width: 100%;
            border-top: 1px solid #e0e0e0; /* Línea gris muy tenue (Igual al index) */
            padding: 20px 40px;
            text-align: center;
        }
        
        .footer-credit {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: normal;
            font-size: 11px; /* Texto muy discreto */
            color: #999;
        }

        .footer-credit strong {
            font-family: 'Alte Haas Grotesk Bold', sans-serif;
            font-weight: normal;
            color: #777;
        }
        
        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            .main-header { padding: 20px; position: static; }
            .main-header .container { flex-direction: column; gap: 15px; align-items: flex-start; }
            nav.main { flex-wrap: wrap; gap: 15px; }
            .contact-title { font-size: 36px; }
            .contact-email { font-size: 18px; }
            footer.bottom-footer { padding: 15px 20px; }
        }
    </style>
</head>
<body class="s-home detail-page">
    
    <!-- CABECERA -->
    <header class="main-header">
        <div class="container">
            <a class="logo" href="index.html">
                <span class="brand-name">Federico Barbabosa</span> 
                <span class="brand-title">Cinematographer</span>
            </a>
            <nav class="main">
                <a href="index.html">Home</a>
                <a href="cine.html">Features</a>
                <a href="comerciales.html">Commercials</a>
                <a href="contacto.html" class="active">Contact</a>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO CENTRAL DE CONTACTO -->
    <div class="page-container">
        <div id="contentWrapper" class="contentWrapper">
            <section class="contact-container">
                <h1 class="contact-title">Contact</h1>
                <a href="mailto:federicobarbabosa@gmail.com" class="contact-email">federicobarbabosa@gmail.com</a>
                
                <!-- ÍCONOS SOCIALES -->
                <div class="social-links">
                    <a href="https://www.instagram.com/fedebarba/" target="_blank" rel="noopener noreferrer" class="social-icon">Instagram</a>
                    <a href="https://www.imdb.com/name/nm0053165/" target="_blank" rel="noopener noreferrer" class="social-icon">IMDb</a>
                </div>
            </section>
        </div>
    </div>
    
    <!-- FOOTER HASTA ABAJO Y DISCRETO (Igual que en index.html) -->
    <footer class="bottom-footer">
        <p class="footer-credit">
            <strong>Website Design:</strong> Colectivo Monclova
        </p>
    </footer>

</body>
</html>
